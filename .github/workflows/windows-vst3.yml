name: Windows VST3 smoke build

on:
  pull_request:
    paths:
      - "spikes/vst3-callback/**"
      - "tools/build-windows-vst3.ps1"
      - ".github/workflows/windows-vst3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-vst3:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Build SuperCollider and the VST3, then validate
        shell: pwsh
        run: .\tools\build-windows-vst3.ps1 -BuildRoot "$env:RUNNER_TEMP\dexter-windows-vst3"

      - name: Upload Windows VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: dexter-foxdot-live-vst3-windows-x64
          path: ${{ runner.temp }}/dexter-windows-vst3/plugin-build/VST3/Release/dexter_sc_tone.vst3
          if-no-files-found: error
          retention-days: 14
